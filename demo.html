<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fravix AI Photo Generator · 2API Demo</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#141824; --panel2:#1b2030; --line:#242b3d;
    --txt:#e8ecf6; --dim:#8b95ad; --acc:#6c8cff; --ok:#2ecc71; --bad:#ff5c74; --warn:#ffb020;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 15% -10%,#1a2038 0%,var(--bg) 55%);color:var(--txt);
       font:14px/1.55 "Segoe UI",-apple-system,"Helvetica Neue",Arial,"Microsoft YaHei",sans-serif;}
  header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;letter-spacing:.4px}
  .badge{font-size:11px;padding:3px 8px;border-radius:999px;background:#1e2740;color:#9db0ff;border:1px solid #2b3557}
  .wrap{display:grid;grid-template-columns:minmax(360px,1fr) minmax(420px,1.25fr);gap:18px;padding:18px 24px 40px}
  @media(max-width:980px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card h2{font-size:13px;margin:0 0 12px;color:var(--dim);font-weight:600;letter-spacing:.6px;text-transform:uppercase}
  .drop{border:1.5px dashed #2f3a58;border-radius:12px;padding:22px;text-align:center;cursor:pointer;transition:.15s;color:var(--dim)}
  .drop:hover,.drop.on{border-color:var(--acc);background:#161d2e;color:var(--txt)}
  .thumb{width:100%;max-height:260px;object-fit:contain;border-radius:10px;background:#0e121b;margin-top:10px}
  textarea,select,input[type=text]{width:100%;background:#0e121b;border:1px solid var(--line);color:var(--txt);
       border-radius:10px;padding:10px;font:inherit;resize:vertical}
  textarea{min-height:74px}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .row>*{flex:1;min-width:130px}
  button{background:var(--acc);color:#06101f;border:0;border-radius:10px;padding:11px 16px;font-weight:700;
       cursor:pointer;font:inherit}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:#212a3f;color:var(--txt);font-weight:600}
  .styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;max-height:270px;overflow:auto;padding-right:4px}
  .style{border:1.5px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:#0e121b;position:relative}
  .style img{width:100%;height:88px;object-fit:cover;display:block}
  .style span{display:block;font-size:10.5px;padding:4px 5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .style.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
  .style .vid{position:absolute;top:4px;right:4px;background:#000a;color:#ffce5c;font-size:9px;padding:1px 5px;border-radius:6px}
  .out{min-height:300px;display:flex;align-items:center;justify-content:center;background:#0e121b;border-radius:12px;overflow:hidden}
  .out img,.out video{max-width:100%;max-height:520px;display:block}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;color:var(--dim);margin-top:12px}
  .kv b{color:var(--txt);font-weight:600}
  .stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
  .stat div{background:var(--panel2);border-radius:10px;padding:9px 10px}
  .stat i{display:block;font-style:normal;color:var(--dim);font-size:11px}
  .stat s{display:block;text-decoration:none;font-size:16px;font-weight:700;margin-top:2px}
  pre{background:#0e121b;border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;max-height:170px;
      font-size:11.5px;color:#9fb2d6;margin:10px 0 0}
  .pill{font-size:10.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1>Fravix · AI Photo Generator 2API</h1>
  <span class="badge" id="hBadge">…</span>
  <span class="badge">cloth-change-core.aperogroup.ai</span>
  <span class="pill" id="hStyle">style: –</span>
  <span class="pill" id="hRoute">route: –</span>
</header>

<div class="wrap">
  <section class="card">
    <h2>1 · 输入</h2>
    <div class="drop" id="drop">
      点击 / 拖入一张人像图（jpg / png，≤12MB）
      <input type="file" id="file" accept="image/*" hidden />
    </div>
    <img class="thumb" id="prev" hidden />
    <div class="row">
      <select id="route">
        <option value="">按风格自动路由（is_video）</option>
        <option value="image">强制图片（qwen-editing）</option>
        <option value="video">强制视频（workflow 轮询）</option>
      </select>
    </div>
    <textarea id="prompt" placeholder="可选：自定义提示词（留空则用所选风格的 positivePrompt）"></textarea>
    <div class="row">
      <button id="go">生成</button>
      <button class="ghost" id="rand">随机风格</button>
    </div>
    <h2 style="margin-top:20px">风格库 <span class="pill" id="cnt">…</span></h2>
    <div class="styles" id="styles"></div>
  </section>

  <section class="card">
    <h2>2 · 产出</h2>
    <div class="out" id="out"><span class="dim">等待生成…</span></div>
    <div class="kv" id="meta"></div>
    <h2 style="margin-top:18px">3 · 网关实时统计</h2>
    <div class="stat">
      <div><i>请求数</i><s id="sReq">0</s></div>
      <div><i>成功率</i><s id="sRate">0%</s></div>
      <div><i>图片 p95</i><s id="sP95">–</s></div>
    </div>
    <div class="stat">
      <div><i>图片 ok/fail</i><s id="sImg">0/0</s></div>
      <div><i>视频 ok/fail</i><s id="sVid">0/0</s></div>
      <div><i>视频 p50</i><s id="sVp50">–</s></div>
    </div>
    <pre id="log">// 调用日志</pre>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
let styles = [], sel = null, file = null;

function log(obj) {
  $('log').textContent = JSON.stringify(obj, null, 2);
}

async function loadStyles() {
  const r = await fetch('/styles');
  const j = await r.json();
  styles = j.items;
  $('cnt').textContent = j.count + ' 个';
  $('styles').innerHTML = '';
  for (const s of styles) {
    const d = document.createElement('div');
    d.className = 'style';
    d.dataset.id = s.id;
    d.innerHTML = `<img loading="lazy" src="${s.thumbnail}" alt="">
      ${s.is_video ? '<span class="vid">VIDEO</span>' : ''}<span>${s.name}</span>`;
    d.onclick = () => pick(s);
    $('styles').appendChild(d);
  }
}

function pick(s) {
  sel = s;
  document.querySelectorAll('.style').forEach(e => e.classList.toggle('sel', e.dataset.id === s.id));
  $('hStyle').textContent = 'style: ' + s.name + (s.is_video ? ' (video)' : '');
  $('hRoute').textContent = 'route: ' + (s.is_video ? 'workflow/video' : 'qwen-editing/image');
  $('prompt').value = '';
  $('prompt').placeholder = '默认使用该风格提示词：' + (s.mode || '');
}

$('drop').onclick = () => $('file').click();
$('drop').ondragover = (e) => { e.preventDefault(); $('drop').classList.add('on'); };
$('drop').ondragleave = () => $('drop').classList.remove('on');
$('drop').ondrop = (e) => {
  e.preventDefault(); $('drop').classList.remove('on');
  if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
};
$('file').onchange = (e) => e.target.files[0] && setFile(e.target.files[0]);

function setFile(f) {
  file = f;
  $('prev').src = URL.createObjectURL(f);
  $('prev').hidden = false;
}

$('rand').onclick = () => pick(styles[Math.floor(Math.random() * styles.length)]);

$('go').onclick = async () => {
  if (!file) { alert('先选一张图片'); return; }
  const fd = new FormData();
  fd.append('image', file);
  if (sel) fd.append('style_id', sel.id);
  const p = $('prompt').value.trim();
  if (p) fd.append('prompt', p);
  const route = $('route').value;
  if (route) fd.append('force', route);
  $('go').disabled = true;
  $('out').innerHTML = '<span class="dim">生成中…</span>';
  const t0 = Date.now();
  try {
    const r = await fetch('/api/v1/generate', { method: 'POST', body: fd });
    const j = await r.json();
    log(j);
    if (!r.ok) { $('out').innerHTML = '<span class="bad">失败: ' + (j.detail || r.status) + '</span>'; return; }
    const src = '/media?url=' + encodeURIComponent(j.url);
    $('out').innerHTML = j.type === 'video'
      ? `<video src="${src}" controls autoplay loop></video>`
      : `<img src="${src}" alt="result">`;
    $('meta').innerHTML = `<span>类型</span><b>${j.type}</b>
      <span>route</span><b>${j.route}</b>
      <span>style</span><b>${j.style_id || '—'}</b>
      <span>上游耗时</span><b>${j.elapsed_ms} ms</b>
      <span>端到端</span><b>${Date.now() - t0} ms</b>
      <span>产出直链</span><b style="word-break:break-all">${j.url}</b>`;
  } catch (e) {
    $('out').innerHTML = '<span class="bad">' + e + '</span>';
  } finally {
    $('go').disabled = false;
  }
};

async function tick() {
  try {
    const [h, s] = await Promise.all([fetch('/health').then(r => r.json()), fetch('/stats').then(r => r.json())]);
    $('hBadge').textContent = `上流 ok · ${h.styles} 风格 / ${h.video_styles} 视频 · up ${h.uptime_s}s`;
    $('sReq').textContent = s.requests;
    $('sRate').textContent = s.success_rate + '%';
    $('sP95').textContent = (s.image.p95_ms || 0) + ' ms';
    $('sImg').textContent = `${s.image.ok}/${s.image.fail}`;
    $('sVid').textContent = `${s.video.ok}/${s.video.fail}`;
    $('sVp50').textContent = (s.video.p50_ms || 0) + ' ms';
  } catch (e) { $('hBadge').textContent = '网关离线'; }
}

loadStyles(); tick(); setInterval(tick, 3000);
</script>
</body>
</html>
